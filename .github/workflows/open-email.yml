name: Aviso apertura de mercado

on:
  schedule:
    - cron: '0 7,8 * * 1-5'
    - cron: '30 13,14 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'europa, wallstreet o auto'
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: open-email
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar cotizaciones
        run: python update_prices.py
        continue-on-error: true

      - name: Enviar aviso
        env:
          SESSION: ${{ github.event.inputs.session || 'auto' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_open_email.py
