name: Aviso apertura de mercado

on:
  schedule:
    # Europa: 09:00 Madrid = 07:00 UTC (verano) o 08:00 UTC (invierno).
    # Ventana ~3 h; crons extra por si Actions se retrasa.
    - cron: '0 7,8,9,10,11 * * 1-5'
    # Wall Street: 09:30 Nueva York = 13:30 UTC (EDT) o 14:30 UTC (EST).
    - cron: '30 13,14,15,16,17 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'europa, wallstreet o auto'
        required: false
        default: auto

permissions:
  contents: read
  actions: write

concurrency:
  group: open-email
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar marcas de envío
        uses: actions/cache@v4
        with:
          path: .open-email-sent
          key: open-email-sent-${{ github.run_id }}
          restore-keys: |
            open-email-sent-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar cotizaciones
        run: python update_prices.py
        continue-on-error: true

      - name: Enviar aviso
        env:
          SESSION: ${{ github.event.inputs.session || 'auto' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python send_open_email.py
