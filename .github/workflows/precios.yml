name: Precios mercado
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-prices]
  schedule:
    - cron: "7 0 * * *"
    - cron: "7 1 * * *"
    - cron: "37 * * * *"
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch market prices
        run: python3 update_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios en precios"
            exit 0
          fi
          git commit -m "chore: actualizar prices.json"
          git pull --rebase origin main
          git push
