name: Actualizar precios
on:
  workflow_dispatch:
  schedule:
    # 02:00 CEST (verano UTC+2) = 00:05 UTC — cierre after-hours USA
    - cron: "5 0 * * *"
    # 02:00 CET (invierno UTC+1) = 01:05 UTC
    - cron: "5 1 * * *"
    # Laborables cada hora, minuto 13, 07:00-23:00 CEST (05-21 UTC)
    # (GitHub descarta el cron */15 por saturación; por eso esta mañana no corrió)
    - cron: "13 5-21 * * 1-5"
    # Finde: BTC a mediodía y noche España
    - cron: "13 10,18 * * 6,0"
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch market prices
        run: python3 update_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios en precios"
            exit 0
          fi
          git commit -m "chore: actualizar prices.json"
          git pull --rebase origin main
          git push
