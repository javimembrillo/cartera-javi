name: Actualizar precios

on:
  schedule:
    # Una vez por hora. Los cron cada 15 min los tira GitHub en repos públicos.
    - cron: "17 * * * *"
    - cron: "5 0 * * *"
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar cotizaciones
        run: python update_prices.py

      - name: Publicar prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios de precio"
            exit 0
          fi
          git commit -m "chore: actualizar precios"
          git pull --rebase origin main
          git push
